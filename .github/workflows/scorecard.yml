name: OpenSSF Scorecard

# Scores this repository's supply-chain posture against the OpenSSF checks: pinned actions,
# branch protection, signed releases, dependency update tooling, fuzzing, SAST, and so on.
#
# The value is not the number. It is that the checks are a published, external checklist,
# so a regression — someone unpinning an action, a gate becoming advisory — shows up as a
# score drop rather than as nothing at all. Several of this project's existing practices
# (SHA-pinned actions, reproducible builds, offline signing, a fuzzing corpus) already score
# well; the point is to notice when that stops being true.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

# The upstream Scorecard template uses `read-all` here. Narrowed to match every other
# workflow in this repository: the analysis job below declares exactly the scopes it needs,
# so the workflow-level default only has to cover the checkout. Flagged by zizmor's
# excessive-permissions audit, and it was right — a supply-chain scorer asking for blanket
# read is a poor advertisement for its own advice.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Publishes the result to the Scorecard API so the README badge resolves, and uploads
      # findings to the Security tab.
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        id: scorecard
        with:
          results_file: results.sarif
          results_format: sarif
          # Required for the public badge and for the Branch-Protection check, which cannot
          # be evaluated with the default token's permissions.
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
